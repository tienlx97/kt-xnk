services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The .NET API's address on the company LAN — this container calls it
      # server-side only (see src/app/api/backend/[...path]/route.js); the
      # browser never talks to it directly, so it does NOT need to be
      # reachable from the internet. Point it at the backend's LAN IP (see
      # BE-kt-xnk's docker-compose.lan.yml), e.g. http://192.168.88.50:8080.
      API_BASE_URL: ${API_BASE_URL:?set the backend's LAN address in .env — see .env.production.example}
    # Not published directly — the nginx service below terminates TLS and
    # forwards to this internal port over the `internal` network.
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - internal
    # Host port 80 is taken by IIS on this machine, so nginx's container
    # port 80 is published on host port 8090 instead. The router's dst-nat
    # maps external port 80 -> this host's 8090 (see docs/deployment.md
    # section 3) so the outside world still just sees plain port 80.
    ports:
      - "8090:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    # Reload picked-up certs periodically without a restart (certbot renews
    # in place; nginx keeps old certs open until it reloads).
    command: >
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Issues and renews the Let's Encrypt certificate. First run needs the
  # one-off command in nginx/README.md; after that this renews quietly.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"]

networks:
  internal:
